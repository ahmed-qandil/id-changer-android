name: build-apk
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle assembleRelease --no-daemon
      - name: Rename unsigned APK
        run: cp app/build/outputs/apk/release/app-release-unsigned.apk id-changer-v1.0-release.apk
      - name: Verify unsigned
        run: |
          if unzip -l id-changer-v1.0-release.apk | grep -q 'META-INF/MANIFEST.MF'; then
            echo "APK is signed - aborting"; exit 1
          fi
          echo "unsigned OK"
      - uses: actions/upload-artifact@v4
        with:
          name: id-changer-apk
          path: id-changer-v1.0-release.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: v1.0.0
          files: id-changer-v1.0-release.apk
