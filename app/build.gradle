plugins {
    id 'com.android.application'
}
android {
    namespace 'com.goldencrad.idchanger'
    compileSdk 34
    defaultConfig {
        applicationId 'com.goldencrad.idchanger'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
